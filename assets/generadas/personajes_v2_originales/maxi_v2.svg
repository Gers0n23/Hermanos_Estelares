<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640">
  <!-- Maxi v2 — redibujado desde assets/anclas/maxi_referencia.png (vista frontal, 2ª de la hoja).
       Traje blanco con paneles azules, estrella dorada, cinturón azul con escudo,
       rodilleras azul oscuro, casco burbuja. Contorno café cálido + halo claro. -->
  <defs>
    <linearGradient id="tela" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f1f2f8"/>
      <stop offset="1" stop-color="#d3d7e6"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a8fd0"/>
      <stop offset="1" stop-color="#3a6bb0"/>
    </linearGradient>
    <radialGradient id="piel" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#fbd9bd"/>
      <stop offset="1" stop-color="#eab48f"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#a8652c"/>
      <stop offset="0.75" stop-color="#6b3a18"/>
      <stop offset="1" stop-color="#3a1f0e"/>
    </radialGradient>
    <radialGradient id="casco" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.8" stop-color="#e8f3ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="brillo_estrella" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3a8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="622" rx="120" ry="13" fill="#8f8a9c" opacity="0.4"/>

  <g stroke="#5a3a26" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- ===== piernas ===== -->
    <path d="M 152 430 L 148 548 L 196 548 L 198 440 Z" fill="url(#tela)"/>
    <path d="M 202 440 L 204 548 L 252 548 L 248 430 Z" fill="url(#tela)"/>
    <!-- franjas azules laterales -->
    <path d="M 152 440 L 149 520 L 160 520 L 162 450 Z" fill="#4a7dc2" stroke-width="2.5"/>
    <path d="M 248 440 L 251 520 L 240 520 L 238 450 Z" fill="#4a7dc2" stroke-width="2.5"/>
    <!-- rodilleras -->
    <ellipse cx="174" cy="492" rx="24" ry="22" fill="#2f5189"/>
    <ellipse cx="174" cy="492" rx="14" ry="12" fill="#3e66a8" stroke-width="2.5"/>
    <ellipse cx="226" cy="492" rx="24" ry="22" fill="#2f5189"/>
    <ellipse cx="226" cy="492" rx="14" ry="12" fill="#3e66a8" stroke-width="2.5"/>
    <!-- botas -->
    <path d="M 142 540 L 200 540 L 202 596 C 202 606 196 610 186 610 L 132 610 C 120 610 118 596 128 588 L 140 580 Z" fill="#f3f4f9"/>
    <path d="M 126 596 C 124 606 128 612 136 612 L 190 612 C 198 612 202 606 202 598 Z" fill="#3a6bb0"/>
    <path d="M 144 552 L 198 552 L 198 566 L 143 566 Z" fill="#4a7dc2" stroke-width="2.5"/>
    <circle cx="186" cy="582" r="7" fill="#4a7dc2" stroke-width="2.5"/>
    <path d="M 200 540 L 258 540 L 260 580 L 272 588 C 282 596 280 610 268 610 L 214 610 C 204 610 198 606 198 596 Z" fill="#f3f4f9"/>
    <path d="M 198 598 C 198 606 202 612 210 612 L 264 612 C 272 612 276 606 274 596 Z" fill="#3a6bb0"/>
    <path d="M 202 552 L 256 552 L 257 566 L 202 566 Z" fill="#4a7dc2" stroke-width="2.5"/>
    <circle cx="214" cy="582" r="7" fill="#4a7dc2" stroke-width="2.5"/>

    <!-- ===== brazos ===== -->
    <path d="M 146 288 C 118 296 100 336 98 392 L 126 396 C 128 356 136 330 150 318 Z" fill="url(#tela)"/>
    <path d="M 254 288 C 282 296 300 336 302 392 L 274 396 C 272 356 264 330 250 318 Z" fill="url(#tela)"/>
    <path d="M 104 318 L 124 322 L 120 352 L 101 348 Z" fill="#4a7dc2" stroke-width="2.5"/>
    <path d="M 296 318 L 276 322 L 280 352 L 299 348 Z" fill="#4a7dc2" stroke-width="2.5"/>
    <rect x="272" y="306" width="18" height="13" rx="3" fill="#8fbde8" stroke-width="2"/>
    <!-- puños azules -->
    <rect x="92" y="388" width="38" height="20" rx="6" fill="#3a6bb0"/>
    <rect x="270" y="388" width="38" height="20" rx="6" fill="#3a6bb0"/>
    <!-- guantes -->
    <path d="M 94 406 C 86 420 88 442 102 448 C 114 452 128 444 128 428 L 128 406 Z" fill="#d7dbe6"/>
    <path d="M 96 426 C 88 428 84 436 90 442" fill="none" stroke-width="3"/>
    <path d="M 306 406 C 314 420 312 442 298 448 C 286 452 272 444 272 428 L 272 406 Z" fill="#d7dbe6"/>
    <path d="M 304 426 C 312 428 316 436 310 442" fill="none" stroke-width="3"/>

    <!-- ===== torso ===== -->
    <path d="M 142 282 C 136 330 140 390 150 438 L 250 438 C 260 390 264 330 258 282 C 230 268 170 268 142 282 Z" fill="url(#tela)"/>
    <!-- paneles azules del pecho -->
    <path d="M 146 292 C 150 320 156 350 164 380 L 176 380 C 170 346 166 316 166 290 Z" fill="#4a7dc2" stroke-width="2.5"/>
    <path d="M 254 292 C 250 320 244 350 236 380 L 224 380 C 230 346 234 316 234 290 Z" fill="#4a7dc2" stroke-width="2.5"/>
    <!-- cinturón -->
    <path d="M 146 400 L 254 400 L 254 424 L 146 424 Z" fill="#3a6bb0"/>
    <rect x="150" y="398" width="24" height="30" rx="5" fill="#2f5189"/>
    <rect x="226" y="398" width="24" height="30" rx="5" fill="#2f5189"/>
    <rect x="182" y="396" width="36" height="32" rx="6" fill="#8fbde8"/>
    <path d="M 200 403 L 210 407 L 208 417 C 206 421 202 423 200 424 C 198 423 194 421 192 417 L 190 407 Z" fill="#f3f4f9" stroke-width="2.5"/>
    <!-- cuello del traje -->
    <path d="M 150 272 C 170 292 230 292 250 272 L 246 262 C 226 278 174 278 154 262 Z" fill="#3a6bb0"/>
  </g>

  <!-- estrella del pecho -->
  <circle cx="200" cy="340" r="36" fill="url(#brillo_estrella)"/>
  <path d="M200,308 L209,327 L230,329 L214,343 L219,364 L200,353 L181,364 L186,343 L170,329 L191,327 Z"
        fill="#ffcd3c" stroke="#c98a12" stroke-width="3" stroke-linejoin="round"/>
  <path d="M195,330 L200,316 L203,329 Z" fill="#fff4bf" opacity="0.9"/>

  <!-- ===== cabeza ===== -->
  <g stroke="#5a3a26" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
