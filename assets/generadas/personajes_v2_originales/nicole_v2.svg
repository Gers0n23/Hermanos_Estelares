    <path d="M 152 430 L 148 548 L 196 548 L 198 440 Z" fill="url(#tela)"/>
    <path d="M 202 440 L 204 548 L 252 548 L 248 430 Z" fill="url(#tela)"/>
    <!-- franjas azules laterales -->
    <path d="M 152 440 L 149 520 L 160 520 L 162 450 Z" fill="#ef6aac" stroke-width="2.5"/>
    <path d="M 248 440 L 251 520 L 240 520 L 238 450 Z" fill="#ef6aac" stroke-width="2.5"/>
    <!-- rodilleras -->
    <ellipse cx="174" cy="492" rx="24" ry="22" fill="#b8407c"/>
    <ellipse cx="174" cy="492" rx="14" ry="12" fill="#e05a9e" stroke-width="2.5"/>
    <ellipse cx="226" cy="492" rx="24" ry="22" fill="#b8407c"/>
    <ellipse cx="226" cy="492" rx="14" ry="12" fill="#e05a9e" stroke-width="2.5"/>
    <!-- botas -->
    <path d="M 142 540 L 200 540 L 202 596 C 202 606 196 610 186 610 L 132 610 C 120 610 118 596 128 588 L 140 580 Z" fill="#fdeef6"/>
    <path d="M 126 596 C 124 606 128 612 136 612 L 190 612 C 198 612 202 606 202 598 Z" fill="#d9488f"/>
    <path d="M 144 552 L 198 552 L 198 566 L 143 566 Z" fill="#ef6aac" stroke-width="2.5"/>
    <circle cx="186" cy="582" r="7" fill="#ef6aac" stroke-width="2.5"/>
    <path d="M 200 540 L 258 540 L 260 580 L 272 588 C 282 596 280 610 268 610 L 214 610 C 204 610 198 606 198 596 Z" fill="#fdeef6"/>
    <path d="M 198 598 C 198 606 202 612 210 612 L 264 612 C 272 612 276 606 274 596 Z" fill="#d9488f"/>
    <path d="M 202 552 L 256 552 L 257 566 L 202 566 Z" fill="#ef6aac" stroke-width="2.5"/>
    <circle cx="214" cy="582" r="7" fill="#ef6aac" stroke-width="2.5"/>

    <!-- ===== brazos ===== -->
    <path d="M 146 288 C 118 296 100 336 98 392 L 126 396 C 128 356 136 330 150 318 Z" fill="url(#tela)"/>
    <path d="M 254 288 C 282 296 300 336 302 392 L 274 396 C 272 356 264 330 250 318 Z" fill="url(#tela)"/>
    <path d="M 104 318 L 124 322 L 120 352 L 101 348 Z" fill="#ef6aac" stroke-width="2.5"/>
    <path d="M 296 318 L 276 322 L 280 352 L 299 348 Z" fill="#ef6aac" stroke-width="2.5"/>
    <rect x="272" y="306" width="18" height="13" rx="3" fill="#ffc4df" stroke-width="2"/>
    <!-- puños azules -->
    <rect x="92" y="388" width="38" height="20" rx="6" fill="#d9488f"/>
    <rect x="270" y="388" width="38" height="20" rx="6" fill="#d9488f"/>
