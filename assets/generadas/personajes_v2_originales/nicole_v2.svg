    <path d="M 94 406 C 86 420 88 442 102 448 C 114 452 128 444 128 428 L 128 406 Z" fill="#f7d4e5"/>
    <path d="M 96 426 C 88 428 84 436 90 442" fill="none" stroke-width="3"/>
    <path d="M 306 406 C 314 420 312 442 298 448 C 286 452 272 444 272 428 L 272 406 Z" fill="#f7d4e5"/>
    <path d="M 304 426 C 312 428 316 436 310 442" fill="none" stroke-width="3"/>

    <!-- ===== torso ===== -->
    <path d="M 142 282 C 136 330 140 390 150 438 L 250 438 C 260 390 264 330 258 282 C 230 268 170 268 142 282 Z" fill="url(#tela)"/>
    <!-- paneles azules del pecho -->
    <path d="M 146 292 C 150 320 156 350 164 380 L 176 380 C 170 346 166 316 166 290 Z" fill="#ef6aac" stroke-width="2.5"/>
    <path d="M 254 292 C 250 320 244 350 236 380 L 224 380 C 230 346 234 316 234 290 Z" fill="#ef6aac" stroke-width="2.5"/>
    <!-- cinturón -->
    <path d="M 146 400 L 254 400 L 254 424 L 146 424 Z" fill="#d9488f"/>
    <rect x="150" y="398" width="24" height="30" rx="5" fill="#b8407c"/>
    <rect x="226" y="398" width="24" height="30" rx="5" fill="#b8407c"/>
    <rect x="182" y="396" width="36" height="32" rx="6" fill="#ffc4df"/>
    <path d="M 200 403 L 210 407 L 208 417 C 206 421 202 423 200 424 C 198 423 194 421 192 417 L 190 407 Z" fill="#fdeef6" stroke-width="2.5"/>
    <!-- cuello del traje -->
    <path d="M 150 272 C 170 292 230 292 250 272 L 246 262 C 226 278 174 278 154 262 Z" fill="#d9488f"/>
  </g>

  <!-- estrella del pecho -->
  <circle cx="200" cy="340" r="36" fill="url(#brillo_estrella)"/>
  <path d="M200,308 L209,327 L230,329 L214,343 L219,364 L200,353 L181,364 L186,343 L170,329 L191,327 Z"
        fill="#8ad8ff" stroke="#3b8fc4" stroke-width="3" stroke-linejoin="round"/>
  <path d="M195,330 L200,316 L203,329 Z" fill="#fff4bf" opacity="0.9"/>

  <!-- ===== cabeza ===== -->
  <g stroke="#5a3a26" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- orejas -->
    <ellipse cx="124" cy="178" rx="17" ry="22" fill="url(#piel)"/>
    <path d="M 122 170 C 116 176 118 188 126 190" fill="none" stroke="#cf8f6c" stroke-width="3"/>
    <ellipse cx="276" cy="178" rx="17" ry="22" fill="url(#piel)"/>
    <path d="M 278 170 C 284 176 282 188 274 190" fill="none" stroke="#cf8f6c" stroke-width="3"/>
    <!-- cara -->
    <path d="M 132 150 C 130 110 160 88 200 88 C 240 88 270 110 268 150 C 268 206 244 244 200 246 C 156 244 132 206 132 150 Z" fill="url(#piel)"/>
    <!-- pelo: casquete + mechones puntiagudos -->
  </g>
  <!-- cejas -->
  <g stroke="#3b2418" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M 152 148 Q 166 140 180 146"/>
    <path d="M 220 146 Q 234 140 248 148"/>
  </g>
  <!-- ojos -->
  <g>
    <ellipse cx="168" cy="178" rx="17" ry="19" fill="#ffffff"/>
    <ellipse cx="168" cy="179" rx="15" ry="17" fill="url(#iris)"/>
    <circle cx="168" cy="180" r="7" fill="#1e0f06"/>
    <circle cx="173" cy="172" r="5" fill="#ffffff"/>
    <circle cx="163" cy="184" r="2.2" fill="#ffffff"/>
    <path d="M 149 172 Q 168 154 187 170" fill="none" stroke="#2a170e" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="232" cy="178" rx="17" ry="19" fill="#ffffff"/>
    <ellipse cx="232" cy="179" rx="15" ry="17" fill="url(#iris)"/>
    <circle cx="232" cy="180" r="7" fill="#1e0f06"/>
    <circle cx="237" cy="172" r="5" fill="#ffffff"/>
    <circle cx="227" cy="184" r="2.2" fill="#ffffff"/>
    <path d="M 213 170 Q 232 154 251 172" fill="none" stroke="#2a170e" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- mejillas, nariz, sonrisa -->
  <ellipse cx="150" cy="208" rx="17" ry="10" fill="#f08c86" opacity="0.55"/>
  <ellipse cx="250" cy="208" rx="17" ry="10" fill="#f08c86" opacity="0.55"/>
  <path d="M 194 204 Q 200 210 206 204" fill="none" stroke="#c98463" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 182 222 Q 200 236 218 222" fill="none" stroke="#7a3f2a" stroke-width="4" stroke-linecap="round"/>

  <path d="M 132 150 C 118 200 114 260 124 330 C 138 318 146 296 144 268 C 150 236 146 196 150 160 Z" fill="#3b2418" stroke="#5a3a26" stroke-width="3.5"/><path d="M 268 150 C 282 200 286 260 276 330 C 262 318 254 296 256 268 C 250 236 254 196 250 160 Z" fill="#3b2418" stroke="#5a3a26" stroke-width="3.5"/><circle cx="200" cy="62" r="22" fill="#3b2418" stroke="#5a3a26" stroke-width="3.5"/><rect x="180" y="74" width="40" height="12" rx="6" fill="#ff7fbf" stroke="#5a3a26" stroke-width="3"/><path d="M 132 156 C 128 108 160 82 200 82 C 242 82 272 108 268 156 C 258 130 240 116 214 112 C 200 128 172 136 146 134 C 140 140 136 148 132 156 Z" fill="#3b2418" stroke="#5a3a26" stroke-width="3.5"/><g fill="none" stroke="#6e4b36" stroke-width="4" stroke-linecap="round" opacity="0.85"><path d="M 168 94 C 184 88 200 88 214 90"/><path d="M 120 220 C 118 250 120 280 126 300"/><path d="M 280 220 C 282 250 280 280 274 300"/></g><circle cx="126" cy="202" r="4" fill="#ffd23f" stroke="#c98a12" stroke-width="1.5"/><circle cx="274" cy="202" r="4" fill="#ffd23f" stroke="#c98a12" stroke-width="1.5"/>
  <g stroke="#2a170e" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M 149 170 L 142 164"/><path d="M 153 164 L 148 157"/><path d="M 251 170 L 258 164"/><path d="M 247 164 L 252 157"/></g>
  
  <!-- ===== casco burbuja (encima de todo) ===== -->
  <circle cx="200" cy="164" r="124" fill="url(#casco)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85"/>
  <circle cx="200" cy="164" r="124" fill="none" stroke="#9cb7d6" stroke-width="1.5" stroke-opacity="0.8"/>
  <path d="M 108 110 C 124 74 156 52 196 46" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
  <ellipse cx="268" cy="78" rx="14" ry="8" transform="rotate(35 268 78)" fill="#ffffff" opacity="0.7"/>
  <!-- anillo del cuello del casco -->
  <path d="M 118 262 C 150 290 250 290 282 262 L 276 250 C 244 274 156 274 124 250 Z" fill="#ef6aac" stroke="#5a3a26" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 130 258 C 160 278 240 278 270 258" fill="none" stroke="#ffc4df" stroke-width="3" stroke-linecap="round"/>
</svg>
