<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640">
  <!-- Nicole v2 — derivada de la plantilla corporal de maxi_v2.svg
       (misma construcción para que los tres hermanos sean coherentes).
       Referencias: assets/anclas/nicole_referencia.png y hermanos_alturas.png. -->
  <defs>
    <linearGradient id="tela" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff7fb"/>
      <stop offset="0.6" stop-color="#fbe2ee"/>
      <stop offset="1" stop-color="#eebad2"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a8fd0"/>
      <stop offset="1" stop-color="#d9488f"/>
    </linearGradient>
    <radialGradient id="piel" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#f7d3b4"/>
      <stop offset="1" stop-color="#e2a782"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#a8652c"/>
      <stop offset="0.75" stop-color="#6b3a18"/>
      <stop offset="1" stop-color="#3a1f0e"/>
    </radialGradient>
    <radialGradient id="casco" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.8" stop-color="#e8f3ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="brillo_estrella" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6f7ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8ad8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="622" rx="120" ry="13" fill="#8f8a9c" opacity="0.4"/>
  <path d="M 200 72 C 138 72 108 112 108 172 C 108 236 96 290 116 336 C 132 316 142 290 146 262 L 254 262 C 258 290 268 316 284 336 C 304 290 292 236 292 172 C 292 112 262 72 200 72 Z" fill="#3b2418" stroke="#5a3a26" stroke-width="3.5"/>

