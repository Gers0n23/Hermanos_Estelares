<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -60 400 580" width="400" height="580">
  <!-- Cometa v2 — redibujado desde assets/anclas/cometa_referencia.png (vista frontal).
       Gota turquesa con antena-estrella, panza clara, bolsito con corazón.
       Contorno café cálido + halo dorado, como las hojas de referencia. -->
  <defs>
    <linearGradient id="cuerpo" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7fe0d2"/>
      <stop offset="0.55" stop-color="#5ccbbd"/>
      <stop offset="1" stop-color="#43ada3"/>
    </linearGradient>
    <radialGradient id="panza" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#e3f8ea"/>
      <stop offset="1" stop-color="#bfeccf"/>
    </radialGradient>
    <radialGradient id="brillo_estrella" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#b8722f"/>
      <stop offset="0.7" stop-color="#7a4119"/>
      <stop offset="1" stop-color="#4a2812"/>
    </radialGradient>
    <path id="silueta" d="M 224 58 C 200 86 140 88 108 126 C 74 166 72 216 92 252 C 104 274 118 284 128 290
      C 108 318 100 360 108 400 C 116 436 156 450 200 450 C 244 450 284 436 292 400
      C 300 360 292 318 272 290 C 282 284 296 274 308 252 C 328 214 326 158 292 122
      C 268 94 244 88 234 60 Z"/>
    <clipPath id="recorte"><use href="#silueta"/></clipPath>
  </defs>

  <!-- sombra en el piso -->
  <ellipse cx="200" cy="500" rx="95" ry="14" fill="#8f8a9c" opacity="0.45"/>

  <!-- antena con estrella -->
  <path d="M 229 60 C 236 28 248 6 266 -14" fill="none" stroke="#6b4a2b" stroke-width="14" stroke-linecap="round"/>
  <path d="M 229 60 C 236 28 248 6 266 -14" fill="none" stroke="#5ccbbd" stroke-width="8" stroke-linecap="round"/>
  <circle cx="270" cy="-20" r="36" fill="url(#brillo_estrella)"/>
  <path d="M270,-46 L277.5,-30.5 L294.5,-28.5 L282,-16.5 L285.5,0.5 L270,-8 L254.5,0.5 L258,-16.5 L245.5,-28.5 L262.5,-30.5 Z"
        fill="#ffd23f" stroke="#c98a12" stroke-width="3" stroke-linejoin="round"/>
  <path d="M265,-33 L270,-40 L273,-32 Z" fill="#fff6c4" opacity="0.9"/>
  <g fill="#ffd23f">
    <circle cx="302" cy="-40" r="2.5"/><circle cx="310" cy="-22" r="2"/><circle cx="300" cy="-4" r="3"/><circle cx="238" cy="-38" r="2"/>
  </g>

  <!-- piernitas -->
  <g stroke="#6b4a2b" stroke-width="4" fill="#4fbcae">
    <path d="M 146 430 C 140 462 150 480 170 480 C 188 480 192 462 188 436 Z"/>
    <path d="M 212 436 C 208 462 212 480 230 480 C 250 480 260 462 254 430 Z"/>
  </g>

  <!-- bracitos (aletas) -->
  <g stroke="#f6d77a" stroke-width="10" fill="none" stroke-linejoin="round">
    <path d="M 114 312 C 96 324 84 346 84 370 C 96 372 110 358 114 344"/>
    <path d="M 286 312 C 304 324 316 346 316 370 C 304 372 290 358 286 344"/>
  </g>
  <g stroke="#6b4a2b" stroke-width="4" fill="#52c2b4" stroke-linejoin="round">
    <path d="M 114 312 C 96 324 84 346 84 370 C 96 372 110 358 114 344 Z"/>
    <path d="M 286 312 C 304 324 316 346 316 370 C 304 372 290 358 286 344 Z"/>
  </g>

  <!-- cuerpo: halo dorado + relleno + sombreado recortado + contorno -->
  <use href="#silueta" fill="none" stroke="#f6d77a" stroke-width="12" stroke-linejoin="round"/>
  <use href="#silueta" fill="url(#cuerpo)"/>
  <g clip-path="url(#recorte)">
    <path d="M 300 90 C 340 170 330 250 290 280 C 310 340 305 420 250 460 L 420 460 L 420 60 Z" fill="#3a9e95" opacity="0.35"/>
    <ellipse cx="200" cy="380" rx="68" ry="56" fill="url(#panza)"/>
    <ellipse cx="150" cy="110" rx="34" ry="16" transform="rotate(-28 150 110)" fill="#ffffff" opacity="0.45"/>
    <ellipse cx="124" cy="140" rx="7" ry="5" fill="#ffffff" opacity="0.5"/>
  </g>
  <use href="#silueta" fill="none" stroke="#6b4a2b" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- cara -->
  <g stroke="#3f6f68" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M 134 152 Q 150 142 168 149"/>
    <path d="M 232 149 Q 250 142 266 152"/>
  </g>
  <g>
    <ellipse cx="156" cy="200" rx="31" ry="34" fill="#2b170c"/>
    <ellipse cx="156" cy="203" rx="25" ry="28" fill="url(#iris)"/>
    <path d="M 139 214 A 20 18 0 0 0 173 214" fill="none" stroke="#d99a5b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="167" cy="188" r="10" fill="#ffffff"/>
    <circle cx="146" cy="214" r="4.5" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="244" cy="200" rx="31" ry="34" fill="#2b170c"/>
    <ellipse cx="244" cy="203" rx="25" ry="28" fill="url(#iris)"/>
    <path d="M 227 214 A 20 18 0 0 0 261 214" fill="none" stroke="#d99a5b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="255" cy="188" r="10" fill="#ffffff"/>
    <circle cx="234" cy="214" r="4.5" fill="#ffffff" opacity="0.9"/>
  </g>
  <ellipse cx="120" cy="244" rx="18" ry="10" fill="#f09a93" opacity="0.7"/>
  <ellipse cx="280" cy="244" rx="18" ry="10" fill="#f09a93" opacity="0.7"/>
  <path d="M 184 246 Q 200 260 216 246" fill="none" stroke="#3a2418" stroke-width="4.5" stroke-linecap="round"/>

  <!-- bolsito con corazón (correa del hombro derecho a la cadera izquierda) -->
  <path d="M 270 296 C 232 330 172 372 142 396" fill="none" stroke="#6b4a2b" stroke-width="11" stroke-linecap="round"/>
  <path d="M 270 296 C 232 330 172 372 142 396" fill="none" stroke="#3f8f88" stroke-width="6" stroke-linecap="round"/>
  <circle cx="124" cy="412" r="38" fill="#e0b04a" stroke="#6b4a2b" stroke-width="4"/>
  <circle cx="124" cy="412" r="30" fill="#46a79d"/>
  <path d="M 104 400 A 30 30 0 0 1 145 398" fill="none" stroke="#7fd6cb" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M124,428 C 107,417 103,404 112,398 C 118,394 123,398 124,403 C 125,398 130,394 136,398 C 145,404 141,417 124,428 Z"
        fill="#f2c14e" stroke="#9a6a14" stroke-width="3" stroke-linejoin="round"/>
</svg>
