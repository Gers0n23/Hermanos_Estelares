         M35 29 H385 A6 6 0 0 1 391 35 V399 A6 6 0 0 1 385 405 H35 A6 6 0 0 1 29 399 V35 A6 6 0 0 1 35 29 Z"/>
    <rect x="15" y="15" width="390" height="470" rx="16" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
  </g>
  <g id="contorno">
