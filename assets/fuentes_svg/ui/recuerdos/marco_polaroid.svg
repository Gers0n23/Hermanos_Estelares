    <path d="M366 470 Q367.1 474.9 372 476 Q367.1 477.1 366 482 Q364.9 477.1 360 476 Q364.9 474.9 366 470 Z" fill="#FFFFFF" stroke="#2B3350" stroke-width="2.5" stroke-linejoin="round"/>
