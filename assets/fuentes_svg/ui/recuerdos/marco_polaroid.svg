<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="0 0 420 500">
  <!-- Polaroid estelar (HE-44, album "Las migas de papa"). PROVISIONAL: pendiente de aprobacion del PO.
       Misma geometria que scripts/ui/foto_recuerdo.gd: proporcion 0,84; margen m = 7% del ancho (29 px);
       pie = 19% del alto (95 px). Ventana de la foto TRANSPARENTE: x 29..391, y 29..405 (362 x 376).
       Se dibuja ENCIMA de la foto. Sin sombra (la pone el codigo). -->
  <defs>
