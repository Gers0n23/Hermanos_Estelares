<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="0 0 420 500">
  <!-- HUECO del album: foto que todavia no se encontro (ficha §7). PROVISIONAL: pendiente del PO.
       Tarjeta completa, misma geometria que marco_polaroid.svg (420 x 500, ventana x 29..391, y 29..405).
       Se distingue de una foto encontrada por tres senales a la vez: borde punteado (silueta de
       marco), cielo violeta con los tres hermanos en silueta, y la gran estrella dorada con "?".
       Nunca gris ni oscuro: es una promesa ("aqui va a haber una foto"), no un error. -->
